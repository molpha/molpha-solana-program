[toolchain]
anchor_version = "1.1.2"
solana_version = "4.1.1"
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.devnet]
molpha = "MoLFGDpFoVnQgwbkTNScKPohCxhbfd61JjFrnotuwzh"

[programs.localnet]
molpha = "MoLFGDpFoVnQgwbkTNScKPohCxhbfd61JjFrnotuwzh"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# `anchor test` builds the program, then runs the Rust + LiteSVM suite.
# LiteSVM needs no validator: run `anchor test --skip-local-validator`, or just `cargo test`.
test = "cargo test --workspace"

[hooks]
