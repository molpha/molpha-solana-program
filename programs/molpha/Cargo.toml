[package]
name = "molpha"
version = "0.1.0"
description = "Molpha Oracle Solana Program"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "molpha"

[features]
default = ["custom-heap", "custom-panic"]
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = [
    "anchor-lang/idl-build",
    "anchor-spl/idl-build",
    "molpha-verifier/idl-build",
]
anchor-debug = []
custom-heap = []
custom-panic = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dependencies]
molpha-verifier = { version = "0.3.1", features = ["anchor"] }
anchor-lang = { version = "1.2.1", features = ["init-if-needed"] }
anchor-spl = { version = "1.2.1", default-features = false, features = [
    "solana-v3",
    "associated_token",
    "token",
    "token_2022",
] }
# Program IDs are defined in code constants
borsh = "1.7.0"
solana-keccak-hasher = { version = "3.1.0", features = ["sha3"] }
solana-instructions-sysvar = "4.0.0"
bytemuck = { version = "1.24", features = ["derive", "min_const_generics"] }
