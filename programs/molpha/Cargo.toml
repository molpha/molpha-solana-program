[package]
name = "molpha"
version = "0.1.0"
description = "Molpha Oracle Solana Program - Merged from molpha-solana and molpha-feed"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "molpha"

[features]
default = []
cu-bench = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = [
    "anchor-lang/idl-build",
    "anchor-spl/idl-build",
]
anchor-debug = []
custom-heap = []
custom-panic = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dependencies]
molpha-verifier = { path = "../../../molpha-verifier" }
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
anchor-spl = { version = "1.1.2", features = ["metadata"] }
spl-token = { version = "9.0.0", features = ["no-entrypoint"] }
# Program IDs are defined in code constants
borsh = "1.7.0"
solana-keccak-hasher = { version = "3.1.0", features = ["sha3"] }
solana-sha256-hasher = "2.3.0"
solana-instructions-sysvar = "3.0.0"
solana-secp256k1-recover = "3.1.1"
libsecp256k1 = { version = "0.6.0", default-features = false }
ethnum = { version = "1.5", default-features = false }
bytemuck = { version = "1.24", features = ["derive", "min_const_generics"] }

[dev-dependencies]
num-bigint = "0.4.6"
