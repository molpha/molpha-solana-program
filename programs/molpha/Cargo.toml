[package]
name = "molpha"
version = "0.1.0"
description = "Molpha Oracle Solana Program - Merged from molpha-solana and molpha-feed"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "molpha"

[features]
default = []
cu-bench = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dependencies]
solana-sdk-ids = "2"
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.32.1", features = ["metadata"] }
spl-token = { version = "4.0.0", features = ["no-entrypoint"] }
# Program IDs are defined in code constants
borsh = "0.10.3"
# Pinned to the 2.x line to stay on `solana-hash 2.3.0`. The 3.1.x releases pull in
# `solana-hash 4.x` (MSRV rustc 1.89), which the Solana platform-tools rustc (1.84) can't build.
solana-keccak-hasher = { version = "2.2", features = ["sha3"] }
solana-secp256k1-recover = "2.2"
libsecp256k1 = { version = "0.6.0", default-features = false }
ethnum = { version = "1.5", default-features = false }

[dev-dependencies]
num-bigint = "0.4.6"
