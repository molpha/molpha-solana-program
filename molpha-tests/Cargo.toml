[package]
name = "molpha-tests"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "LiteSVM integration tests for the Molpha Solana program"
# Each file under tests/ would otherwise become its own executable, and every one statically
# links LiteSVM plus the Agave runtime. Parallel links of those binaries exhaust CI memory and
# rust-lld dies with SIGBUS. One harness links that graph once; the files stay modules of it.
autotests = false

[lib]
name = "molpha_tests"
path = "src/lib.rs"

[[test]]
name = "suite"
path = "tests/suite.rs"

[dependencies]
molpha = { path = "../programs/molpha", features = ["no-entrypoint"] }
molpha-verifier = { version = "0.4.0", features = ["anchor"] }
anchor-lang = "1.2.1"
anchor-spl = { version = "1.2.1", default-features = false, features = [
    "solana-v3",
    "associated_token",
    "token",
] }
litesvm = { version = "0.17.0", features = ["precompiles"] }
solana-account = "4.7"
solana-keypair = "3.1"
solana-message = "4.6"
solana-signer = "3.0"
solana-transaction = { version = "4.3", features = ["serde"] }
libsecp256k1 = "0.7"
serde_json = "1"
solana-keccak-hasher = { version = "3.1.0", features = ["sha3"] }
solana-transaction-error = "3.4"
solana-instruction-error = "2.4"
solana-address-lookup-table-interface = { version = "3.1", features = ["bincode"] }
agave-feature-set = "4.3"
solana-loader-v3-interface = "8.1"
base64 = "0.23.1"
borsh = "1.7.0"
bytemuck = { version = "1.24", features = ["derive", "min_const_generics"] }
bincode = "1.3"
