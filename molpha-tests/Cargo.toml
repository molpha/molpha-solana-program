[package]
name = "molpha-tests"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "LiteSVM integration tests for the Molpha Solana program"
# Each file under tests/ would otherwise become its own executable, and every one statically
# links LiteSVM plus the Agave runtime. Parallel links of those binaries exhaust CI memory and
# rust-lld dies with SIGBUS. One harness links that graph once; the files stay modules of it.
autotests = false

[lib]
name = "molpha_tests"
path = "src/lib.rs"

[[test]]
name = "suite"
path = "tests/suite.rs"

[dependencies]
molpha = { path = "../programs/molpha", features = ["no-entrypoint"] }
molpha-verifier = { version = "0.3.0-dev.15", features = ["anchor"] }
anchor-lang = "1.2.0"
anchor-spl = { version = "1.2.0", default-features = false, features = [
    "associated_token",
    "token",
] }
litesvm = { version = "0.16.0", features = ["precompiles"] }
solana-account = "4.3"
solana-clock = "3.1"
solana-keypair = "3.1"
solana-message = "4.4"
solana-signer = "3.0"
solana-transaction = { version = "4.1", features = ["serde"] }
libsecp256k1 = "0.7"
serde_json = "1"
solana-keccak-hasher = { version = "3.1.0", features = ["sha3"] }
solana-transaction-error = "4.1"
solana-instruction = "3.4"
solana-address-lookup-table-interface = { version = "3.1", features = ["bincode"] }
agave-feature-set = "4.2"
base64 = "0.23.1"
borsh = "1.7.0"
bytemuck = { version = "1.24", features = ["derive", "min_const_generics"] }
bincode = "1.3"
