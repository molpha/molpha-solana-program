[workspace]
members = [
    "programs/molpha",
    "molpha-tests",
]
exclude = [
    "molpha-verifier",
]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# Local verifier with the coalition-key (x, y) path (not yet published to crates.io).
[patch.crates-io]
molpha-verifier = { path = "../molpha-verifier" }
