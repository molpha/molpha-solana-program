name: Release secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Source and history secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test the scanner
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Scan current source
        run: python3 scripts/scan-secrets.py
      - name: Scan complete fetched history
        run: python3 scripts/scan-secrets.py --history
