[package]
name = "molpha-verifier"
version = "0.1.0"
description = "Molpha on-chain registry state and DataUpdate aggregate-Schnorr verification"
edition = "2021"

[lib]
name = "molpha_verifier"

[features]
default = []
borsh = ["dep:borsh"]
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1" }
solana-keccak-hasher = { version = "3.1.0", features = ["sha3"] }
solana-secp256k1-recover = "3.1.1"
libsecp256k1 = { version = "0.6.0", default-features = false }
ethnum = { version = "1.5", default-features = false }
borsh = { version = "0.10.3", optional = true }

[dev-dependencies]
num-bigint = "0.4.6"
